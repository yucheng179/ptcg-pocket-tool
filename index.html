<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的 PTCG Pocket 自製小工具</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button id="sidebar-toggle" class="sidebar-toggle-btn">☰</button>
                <h2 class="sidebar-title">圖鑑分類</h2>
            </div>
            <ul id="sidebar-menu" class="sidebar-menu">
                <li><span class="nav-icon">✨</span><span class="nav-text">稀有度</span></li>
                <li id="nav-card-catalog"><span class="nav-icon">📓</span><span class="nav-text">卡片圖鑑</span></li>
                <li id="nav-meta-decks"><span class="nav-icon">🔥</span><span class="nav-text">Meta牌組</span></li>
                <li id="nav-needed-cards"><span class="nav-icon">🎯</span><span class="nav-text">需要卡</span></li>
                <li id="nav-general-cards"><span class="nav-icon">🛠️</span><span class="nav-text">泛用卡</span></li>
                <li id="nav-two-star-cards"><span class="nav-icon">🌟</span><span class="nav-text">高星卡</span></li>
                <li id="nav-alt-acc" class="active"><span class="nav-icon">🌱</span><span class="nav-text">小帳資源</span></li>
                <li id="nav-24h-challenge"><span class="nav-icon">⏱️</span><span class="nav-text">24H得卡挑戰</span></li>
            </ul>
        </aside>

        <main class="main-content">
            <header>
                <h1 id="page-title">小帳資源</h1>
                <div id="auth-panel" class="auth-panel">
                    <div id="auth-user-info" class="auth-user-info">尚未登入</div>
                    <button id="btn-google-login" class="btn-secondary" type="button">使用 Google 登入</button>
                    <button id="btn-google-logout" class="btn-secondary" type="button" style="display: none;">登出</button>
                </div>
            </header>
            
            <section id="view-alt-acc" class="content-section">
                <div class="account-tabs">
                    <button class="tab-btn acc-tab-btn active" data-acc="小帳">小帳</button>
                    <button class="tab-btn acc-tab-btn" data-acc="資源帳">資源帳</button>
                </div>
                <div id="rarity-rows-container" class="rarity-rows-container"></div>
            </section>

            <section id="view-24h-challenge" class="content-section" style="display: none;">
                <div id="challenge-24h-tabs" class="deck-tabs-bar challenge-24h-tabs"></div>
                <div id="rarity-rows-24h-container" class="rarity-rows-container"></div>
            </section>

            <section id="view-needed-cards" class="content-section" style="display: none;">
                <div class="account-tabs">
                    <button class="tab-btn needed-tab-btn active" data-needed="缺少的卡">缺少的卡</button>
                    <button class="tab-btn needed-tab-btn" data-needed="金邊">金邊</button>
                </div>
                <div id="rarity-rows-needed-container" class="rarity-rows-container"></div>
            </section>

            <section id="view-general-cards" class="content-section" style="display: none;">
                <div id="rarity-rows-general-container" class="rarity-rows-container"></div>
            </section>

            <section id="view-card-catalog" class="content-section" style="display: none;">
                <div id="catalog-expansion-list-view">
                    <div class="catalog-search-bar">
                        <input id="catalog-global-search" type="search" placeholder="搜尋所有擴充包卡片">
                        <div id="catalog-global-filters" class="catalog-filter-panel"></div>
                    </div>
                    <div class="account-tabs catalog-series-tabs">
                        <button class="tab-btn catalog-series-tab-btn active" data-series="B">B系列</button>
                        <button class="tab-btn catalog-series-tab-btn" data-series="A">A系列</button>
                        <button class="tab-btn catalog-series-tab-btn" data-series="PROMO">Promo</button>
                    </div>
                    <div id="catalog-expansions-grid" class="catalog-expansions-grid"></div>
                </div>
                <div id="catalog-expansion-detail-view" style="display: none;">
                    <div class="catalog-detail-header">
                        <button id="btn-back-catalog-expansions" class="btn-secondary">🔙 返回擴充包列表</button>
                        <div class="catalog-detail-title">
                            <img id="catalog-detail-logo" src="" alt="">
                            <h2 id="catalog-detail-name"></h2>
                        </div>
                        <button id="btn-toggle-catalog-cardtype" class="btn-secondary">依類型分群</button>
                    </div>
                    <div class="catalog-search-bar catalog-detail-search-bar">
                        <input id="catalog-detail-search" type="search" placeholder="搜尋此擴充包卡片">
                        <div id="catalog-detail-filters" class="catalog-filter-panel"></div>
                    </div>
                    <div id="catalog-cards-grid" class="catalog-cards-grid"></div>
                </div>
            </section>

            <section id="view-two-star-cards" class="content-section" style="display: none;">
                <div class="account-tabs">
                    <button class="tab-btn two-star-tab-btn active" data-twostar="擁有的卡">擁有的卡</button>
                    <button class="tab-btn two-star-tab-btn" data-twostar="想要的卡">想要的卡</button>
                    <button class="tab-btn two-star-tab-btn" data-twostar="被交換的">被交換的</button>
                </div>
                <div id="rarity-rows-two-star-container" class="rarity-rows-container"></div>
            </section>

            <section id="view-meta-decks" class="content-section" style="display: none;">
                <div id="meta-decks-list-view">
                    <div class="meta-lobby-tabs-row">
                        <div id="meta-lobby-tabs" class="deck-tabs-bar meta-lobby-tabs"></div>
                    </div>
                    <div class="deck-tier-block" id="auto-team-block" style="display: none;">
                        <div class="decks-grid" id="auto-team-grid"></div>
                    </div>
                    <div class="deck-tier-block" id="tier-0-block">
                        <h2 class="deck-tier-heading">👑 Tier 0</h2>
                        <div class="decks-grid" id="tier-0-grid"></div>
                    </div>
                    <div class="deck-tier-block" id="tier-1-block">
                        <h2 class="deck-tier-heading">🏆 Tier 1</h2>
                        <div class="decks-grid" id="tier-1-grid"></div>
                    </div>
                    <div class="deck-tier-block" id="tier-2-block">
                        <h2 class="deck-tier-heading">⚔️ Tier 2</h2>
                        <div class="decks-grid" id="tier-2-grid"></div>
                    </div>
                    <div class="deck-tier-block" id="tier-3-block">
                        <h2 class="deck-tier-heading">🛡️ Tier 3 & 有趣牌組</h2>
                        <div class="decks-grid" id="tier-3-grid"></div>
                    </div>
                </div>

                <div id="meta-deck-detail-view" style="display: none;">
                    <div style="margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between;">
                        <button id="btn-back-decks" class="btn-secondary">🔙 返回牌組列表</button>
                        <div class="deck-detail-header-actions">
                            <button id="btn-import-deck-list" class="btn-secondary">匯入牌組</button>
                            <h2 id="detail-deck-title" style="margin: 0; color: #007aff;"></h2>
                        </div>
                    </div>
                    <div class="deck-detail-layout">
                        <div class="deck-detail-left">
                            <img id="detail-deck-cover" src="" alt="王牌寶可夢" onerror="this.src='https://placehold.co/300x420/eaeaea/999999?text=Cover'">
                        </div>
                        <div class="deck-detail-right" id="detail-deck-rows">
                            </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div id="form-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="close-modal">&times;</span>
            <h2 id="modal-title">➕ 新增卡片資料</h2>
            <form id="card-form">
                <div class="input-group" style="position: relative;">
                    <label>寶可夢名稱：</label>
                    <input type="text" id="card-name" placeholder="例如: 妙蛙種子" autocomplete="off">
                    <div id="custom-autocomplete-list" class="autocomplete-dropdown"></div>
                </div>
                <div class="input-group">
                    <label>卡片編號：</label>
                    <input type="text" id="card-id" placeholder="例如: A1-001">
                </div>
                <div class="input-group">
                    <label>圖片網址：</label>
                    <input type="url" id="card-img" placeholder="請貼上圖片網址">
                </div>
                
                <div class="input-group" id="group-acc-type">
                    <label>所屬帳號：</label>
                    <select id="card-acc-type">
                        <option value="小帳">小帳</option>
                        <option value="資源帳">資源帳</option>
                    </select>
                </div>

                <div class="input-group" id="group-needed-tab" style="display: none;">
                    <label>所屬分類：</label>
                    <select id="card-needed-tab">
                        <option value="缺少的卡">缺少的卡</option>
                        <option value="金邊">金邊</option>
                    </select>
                </div>

                <div class="input-group" id="group-general-type" style="display: none;">
                    <label>泛用卡類型：</label>
                    <select id="card-general-type">
                        <option value="支援者">支援者</option>
                        <option value="物品">物品</option>
                        <option value="道具">道具</option>
                        <option value="競技場">競技場</option>
                        <option value="寶可夢">寶可夢</option>
                    </select>
                </div>
                
                <div class="input-group" id="group-general-subtype" style="display: none;">
                    <label>分類：</label>
                    <select id="card-general-subtype">
                        <option value="false">通用</option>
                        <option value="true">特殊屬性</option>
                    </select>
                </div>

                <div class="input-group" id="group-general-tag" style="display: none;">
                    <label>泛用卡標籤：</label>
                    <input type="text" id="card-general-tag-name" placeholder="選擇或輸入新標籤">
                    <div id="general-tag-list" class="general-tag-options"></div>
                    <input type="hidden" id="card-general-tag-color" value="#787774">
                </div>

                <div class="input-group" id="group-two-star-tab" style="display: none;">
                    <label>高罕卡分類：</label>
                    <select id="card-two-star-tab">
                        <option value="擁有的卡">擁有的卡</option>
                        <option value="想要的卡">想要的卡</option>
                        <option value="被交換的">被交換的</option>
                    </select>
                </div>

                <div class="input-group" id="group-two-star-status" style="display: none;">
                    <label>帳號狀態：</label>
                    <select id="card-two-star-status">
                        <option value="主帳">主帳</option>
                        <option value="小帳">小帳</option>
                        <option value="資源帳">資源帳</option>
                    </select>
                </div>

                <div class="input-group" id="group-two-star-type" style="display: none;">
                    <label>卡片類型：</label>
                    <select id="card-two-star-type">
                        <option value="支援者">支援者</option>
                        <option value="寶可夢">寶可夢</option>
                    </select>
                </div>
                
                <div class="input-group" id="group-two-star-tier" style="display: none;">
                    <label>評級：</label>
                    <select id="card-two-star-tier">
                        <option value="SS">SS 級</option>
                        <option value="S">S 級</option>
                        <option value="A">A 級</option>
                        <option value="B">B 級</option>
                        <option value="C">C 級</option>
                        <option value="D">D 級</option>
                        <option value="E">E 級</option>
                        <option value="無" selected>無 (未評級)</option>
                    </select>
                </div>

                <div class="input-group" id="group-traded-card" style="display: none; position: relative;">
                    <label>交換的卡：</label>
                    <input type="text" id="card-traded-name" placeholder="搜尋交換到/換出的卡片" autocomplete="off">
                    <input type="hidden" id="card-traded-id">
                    <input type="hidden" id="card-traded-img">
                    <div id="traded-card-autocomplete-list" class="autocomplete-dropdown"></div>
                    <div id="traded-card-preview" class="traded-card-preview"></div>
                </div>
                
                <div class="input-group" id="group-rarity">
                    <label>稀有度：</label>
                    <select id="card-rarity">
                        <option value="1菱">1菱</option>
                        <option value="2菱">2菱</option>
                        <option value="3菱">3菱</option>
                        <option value="4菱">4菱</option>
                        <option value="1星">1星</option>
                        <option value="2星">2星</option>
                        <option value="3星">3星</option>
                        <option value="1閃">1閃</option>
                        <option value="2閃">2閃</option>
                        <option value="皇冠">皇冠</option>
                    </select>
                </div>

                <div class="input-group" id="group-has-main">
                    <label>主帳是否有？：</label>
                    <select id="card-has-main">
                        <option value="false">主帳沒有的</option>
                        <option value="true">主帳有的</option>
                    </select>
                </div>

                <div class="input-group" id="group-ownership" style="display: none;">
                    <label>擁有狀態：</label>
                    <select id="card-ownership">
                        <option value="無">無</option>
                        <option value="取得">取得</option>
                        <option value="小帳">小帳</option>
                        <option value="資源帳">資源帳</option>
                    </select>
                </div>

                <div class="input-group" id="group-needed-qty" style="display: none;">
                    <label>需要數量：</label>
                    <input type="number" id="card-needed-qty" value="1" min="1">
                </div>

                <div class="input-group">
                    <label>卡片底色 (快速選擇或自訂)：</label>
                    <div class="color-palette" id="color-palette">
                        <div class="color-swatch selected" style="background-color: #FFFFFF;" data-color="#FFFFFF" title="白色"></div>
                        <div class="color-swatch" style="background-color: #FFB7B2;" data-color="#FFB7B2" title="淺紅"></div>
                        <div class="color-swatch" style="background-color: #FFCC6E;" data-color="#FFCC6E" title="淺橘"></div>
                        <div class="color-swatch" style="background-color: #FFFFBE;" data-color="#FFFFBE" title="淺黃"></div>
                        <div class="color-swatch" style="background-color: #D2EEA5;" data-color="#D2EEA5" title="淺綠"></div>
                        <div class="color-swatch" style="background-color: #E0E0FF;" data-color="#E0E0FF" title="淺藍"></div>
                        <div class="color-swatch" style="background-color: #FFEAFF;" data-color="#FFEAFF" title="淺紫"></div>
                        <div class="color-swatch" style="background-color: #D3D3D3;" data-color="#D3D3D3" title="淺灰"></div>
                        <input type="color" id="card-bgcolor" value="#ffffff" title="自訂其他顏色">
                    </div>
                </div>
                <button type="submit" class="btn-primary" style="width:100%; margin-top: 10px;">儲存</button>
            </form>
        </div>
    </div>

    <div id="general-tag-color-popover" class="general-tag-color-popover"></div>

    <div id="deck-form-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="close-deck-modal">&times;</span>
            <h2 id="deck-modal-title">➕ 新增 Meta 牌組</h2>
            <form id="deck-form">
                <div class="input-group">
                    <label>牌組名稱：</label>
                    <input type="text" id="deck-name" placeholder="例如: 皮卡丘EX快攻" required>
                </div>
                <div class="input-group">
                    <label>封面寶可夢名稱：</label>
                    <input type="text" id="deck-cover-card-name" placeholder="例如: 皮卡丘EX" autocomplete="off">
                    <div id="deck-main-cover-autocomplete-list" class="autocomplete-dropdown"></div>
                </div>
                <div class="input-group">
                    <label>封面寶可夢圖片網址：</label>
                    <input type="url" id="deck-img" placeholder="請貼上封面圖片網址" required>
                </div>
                <div class="input-group">
                    <label>版本：</label>
                    <select id="deck-version"></select>
                </div>
                <div class="input-group">
                    <label>所屬強度 (Tier)：</label>
                    <select id="deck-tier">
                        <option value="Tier 0">Tier 0</option>
                        <option value="Tier 1">Tier 1</option>
                        <option value="Tier 2">Tier 2</option>
                        <option value="Tier 3">Tier 3 & 其他</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>主屬性：</label>
                    <select id="deck-attribute">
                        <option value="草">草</option>
                        <option value="火">火</option>
                        <option value="水">水</option>
                        <option value="電">電</option>
                        <option value="超">超能</option>
                        <option value="鬥">鬥</option>
                        <option value="惡">惡</option>
                        <option value="鋼">鋼</option>
                        <option value="龍">龍</option>
                        <option value="無">無</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary" style="width:100%; margin-top: 10px;">儲存牌組</button>
            </form>
        </div>
    </div>

    <div id="deck-card-form-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="close-deck-card-modal">&times;</span>
            <h2>➕ 放入卡牌至牌組</h2>
            <form id="deck-card-form">
                <div class="input-group" style="position: relative;">
                    <label>搜尋寶可夢名稱：</label>
                    <input type="text" id="deck-card-name" placeholder="例如: 妙蛙種子" autocomplete="off" required>
                    <input type="hidden" id="deck-card-id">
                    <input type="hidden" id="deck-card-rarity">
                    <div id="deck-autocomplete-list" class="autocomplete-dropdown"></div>
                </div>
                <div class="input-group">
                    <label>圖片網址：</label>
                    <input type="url" id="deck-card-img" placeholder="請貼上封面圖片網址">
                </div>
                <div class="input-group">
                    <label>卡牌種類：</label>
                    <select id="deck-card-type">
                        <option value="寶可夢">寶可夢</option>
                        <option value="支援者">支援者</option>
                        <option value="物品、道具、競技場">物品、道具、競技場</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>投入數量：</label>
                    <div id="deck-card-qty" class="deck-qty-selector" role="radiogroup" aria-label="投入數量">
                        <button type="button" class="deck-qty-option" data-qty="1" role="radio" aria-checked="false">1</button>
                        <button type="button" class="deck-qty-option active" data-qty="2" role="radio" aria-checked="true">2</button>
                    </div>
                </div>
                <div class="input-group">
                    <label>卡片底色 (快速選擇或自訂)：</label>
                    <div class="color-palette" id="deck-card-color-palette">
                        <div class="deck-color-swatch selected" style="background-color: #FFFFFF;" data-color="#FFFFFF" title="白色"></div>
                        <div class="deck-color-swatch" style="background-color: #FFB7B2;" data-color="#FFB7B2" title="淺紅"></div>
                        <div class="deck-color-swatch" style="background-color: #FFCC6E;" data-color="#FFCC6E" title="淺橘"></div>
                        <div class="deck-color-swatch" style="background-color: #FFFFBE;" data-color="#FFFFBE" title="淺黃"></div>
                        <div class="deck-color-swatch" style="background-color: #D2EEA5;" data-color="#D2EEA5" title="淺綠"></div>
                        <div class="deck-color-swatch" style="background-color: #E0E0FF;" data-color="#E0E0FF" title="淺藍"></div>
                        <div class="deck-color-swatch" style="background-color: #FFEAFF;" data-color="#FFEAFF" title="淺紫"></div>
                        <div class="deck-color-swatch" style="background-color: #D3D3D3;" data-color="#D3D3D3" title="淺灰"></div>
                        <input type="color" id="deck-card-bgcolor" value="#ffffff" title="自訂其他顏色">
                    </div>
                </div>
                <button type="submit" class="btn-primary" style="width:100%; margin-top: 10px;">加入牌組</button>
            </form>
        </div>
    </div>

    <div id="deck-cover-form-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="close-deck-cover-modal">&times;</span>
            <h2>✏️ 編輯左側大卡</h2>
            <form id="deck-cover-form">
                <div class="input-group" style="position: relative;">
                    <label>卡片名稱：</label>
                    <input type="text" id="deck-cover-name" placeholder="例如: 超級阿勃梭魯ex" autocomplete="off">
                    <div id="deck-cover-autocomplete-list" class="autocomplete-dropdown"></div>
                </div>
                <div class="input-group">
                    <label>圖片網址：</label>
                    <input type="url" id="deck-cover-img" placeholder="請貼上左側大卡圖片網址">
                </div>
                <button type="submit" class="btn-primary" style="width:100%; margin-top: 10px;">儲存左側大卡</button>
            </form>
        </div>
    </div>

    <div id="deck-replacement-form-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="close-deck-replacement-modal">&times;</span>
            <h2 id="deck-replacement-modal-title">✏️ 編輯可替換卡片</h2>
            <form id="deck-replacement-form">
                <div class="input-group" style="position: relative;">
                    <label>搜尋卡片名稱：</label>
                    <input type="text" id="deck-replacement-name" placeholder="例如: 神奇糖果" autocomplete="off" required>
                    <div id="deck-replacement-autocomplete-list" class="autocomplete-dropdown"></div>
                </div>
                <div class="input-group">
                    <label>圖片網址：</label>
                    <input type="url" id="deck-replacement-img" placeholder="輸入卡片圖片網址">
                </div>
                <div class="input-group">
                    <label>投入數量：</label>
                    <div id="deck-replacement-qty" class="deck-qty-selector" role="radiogroup" aria-label="替換卡投入數量">
                        <button type="button" class="deck-replacement-qty-option active" data-qty="1" role="radio" aria-checked="true">1</button>
                        <button type="button" class="deck-replacement-qty-option" data-qty="2" role="radio" aria-checked="false">2</button>
                    </div>
                </div>
                <button type="button" id="add-second-source-card" class="btn-secondary" style="display:none; width:100%; margin-top: 10px;">＋ 新增基準卡</button>
                <button type="submit" class="btn-primary" style="width:100%; margin-top: 10px;">儲存卡片</button>
            </form>
        </div>
    </div>

    <div id="quick-tier-modal" class="modal">
        <div class="modal-content" style="width: 260px; text-align: center; padding: 20px;">
            <span class="close-btn" id="close-quick-tier-modal">&times;</span>
            <h2 style="margin-top: 0; font-size: 18px; color: #555;">選擇卡片評級</h2>
            <div class="quick-tier-options">
                <button class="tier-btn tier-ss" data-tier="SS">SS 級</button>
                <button class="tier-btn tier-s" data-tier="S">S 級</button>
                <button class="tier-btn tier-a" data-tier="A">A 級</button>
                <button class="tier-btn tier-b" data-tier="B">B 級</button>
                <button class="tier-btn tier-c" data-tier="C">C 級</button>
                <button class="tier-btn tier-de" data-tier="D">D 級</button>
                <button class="tier-btn tier-de" data-tier="E">E 級</button>
                <button class="tier-btn tier-default" data-tier="無" style="width: 100%;">無 (清除評分)</button>
            </div>
        </div>
    </div>

    <div id="deck-import-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="close-deck-import-modal">&times;</span>
            <h2>📥 匯入牌組</h2>
            <form id="deck-import-form">
                <div class="input-group">
                    <label>貼上牌組文字：</label>
                    <textarea id="deck-import-text" class="deck-import-textarea" placeholder="2 Magnemite B1a 24&#10;2 Magneton A1 98&#10;Energy: Lightning" required></textarea>
                </div>
                <label class="deck-import-checkbox">
                    <input type="checkbox" id="deck-import-replace" checked>
                    清空目前分頁卡片後匯入
                </label>
                <button type="submit" class="btn-primary" style="width:100%; margin-top: 10px;">匯入牌組</button>
            </form>
        </div>
    </div>

    <div id="lightbox-modal" class="lightbox-modal">
        <span class="lightbox-close" id="lightbox-close">&times;</span>
        <img id="lightbox-img" class="lightbox-img" src="" alt="Enlarged Card">
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
