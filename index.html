<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的 PTCG 專屬筆記</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>📚 我的工作區</h2>
            </div>
            <ul id="sidebar-menu" class="sidebar-menu"></ul>
            <div class="sidebar-footer">
                <button id="add-page-btn" class="btn-secondary">➕ 新增主頁面</button>
            </div>
        </aside>

        <main class="main-content">
            <header>
                <h1 id="page-title">請選擇或建立分類</h1>
                <span id="page-type-badge" class="badge"></span>
            </header>
            
            <section id="view-gallery" class="gallery-section" style="display: none;">
                <div id="gallery" class="gallery"></div>
            </section>

            <section id="view-note" class="note-section" style="display: none;">
                <div id="note-editor" class="rich-text-editor" contenteditable="true" placeholder="在這裡輸入筆記、貼上表格或圖片..."></div>
            </section>
        </main>
    </div>

    <div id="form-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="close-modal">&times;</span>
            <h2>➕ 新增卡片</h2>
            <form id="card-form">
                <div class="input-group">
                    <label for="card-name">寶可夢名稱：</label>
                    <input type="text" id="card-name" placeholder="例如: 傑尼龜" required>
                </div>
                <div class="input-group">
                    <label for="card-id">卡片編號：</label>
                    <input type="text" id="card-id" placeholder="例如: A1-007" required>
                </div>
                <div class="input-group">
                    <label for="card-img">圖片網址：</label>
                    <input type="url" id="card-img" placeholder="請貼上圖片 URL" required>
                </div>
                <button type="submit" class="btn-submit">加入本頁</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
